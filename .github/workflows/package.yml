name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Lua 5.1 compiler
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check and package addon
        run: python3 tools/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SquanchOn-package
          path: |
            dist/SquanchOn-*.zip
            dist/SquanchOn-*.zip.sha256
          if-no-files-found: error
