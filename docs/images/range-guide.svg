<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">Selected-target range marker guide</title>
<desc id="desc">Schematic examples: a dashed ring identifies the selected target, cardinal blocks indicate five-yard melee reach, and triangles indicate a learned ranged or healing spell in range. These are range cues, not cast-readiness guarantees.</desc>
<defs><g id="ring" fill="none" stroke="#d2d5d1" stroke-width="3" stroke-dasharray="8 5"><circle r="43"/></g></defs>
<rect width="1280" height="320" rx="14" fill="#141a1d"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="38" fill="#c5a571" font-size="14" letter-spacing="2">SELECTED-TARGET MARKERS / ILLUSTRATED LEGEND</text>
<path d="M427 64v208 M853 64v208" stroke="#343d40"/>
<g transform="translate(213 132)"><use href="#ring"/></g>
<g transform="translate(640 132)"><use href="#ring"/><g fill="#e4bc77"><rect x="-9" y="-62" width="18" height="8"/><rect x="-9" y="54" width="18" height="8"/><rect x="-62" y="-9" width="8" height="18"/><rect x="54" y="-9" width="8" height="18"/></g></g>
<g transform="translate(1067 132)"><use href="#ring"/><g fill="#c98f7d"><path d="m0-52-8-15h16z M52 0l15-8v16z M0 52l-8 15h16z M-52 0l-15-8v16z"/></g></g>
<g text-anchor="middle">
<text x="213" y="226" fill="#f1eee7" font-size="22" font-weight="bold">Selected target</text>
<text x="640" y="226" fill="#f1eee7" font-size="22" font-weight="bold">Melee reach</text>
<text x="1067" y="226" fill="#f1eee7" font-size="22" font-weight="bold">Spell range</text>
<text x="213" y="256" fill="#afbbc0" font-size="16">Dashed ring on its visible nameplate</text>
<text x="640" y="256" fill="#afbbc0" font-size="16">Cardinal blocks · conservative 5 yards</text>
<text x="1067" y="256" fill="#afbbc0" font-size="16">Triangles · learned damage or heal</text>
</g>
<text x="32" y="300" fill="#8c9a9f" font-size="13">Range cues require an affirmative compatible check. Proximity alone does not indicate healing range or cast readiness.</text>
</g></svg>
