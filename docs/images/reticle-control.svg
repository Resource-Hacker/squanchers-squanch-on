<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Squanch-On: keep the camera locked, open mouseover only when you mean it</title>
<desc id="desc">Control diagram. Steer with centered mouseover closed, hold right mouse to open true mouseover, release to close it. The camera remains locked in all three states.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1d2225"/><stop offset="1" stop-color="#0d1012"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#be5542" stop-opacity=".22"/><stop offset="1" stop-color="#be5542" stop-opacity="0"/></radialGradient>
  <g id="aim" fill="none" stroke="currentColor" stroke-width="2.5"><circle r="25" stroke-dasharray="7 5"/><path d="M0-39v9 M0 30v9 M-39 0h9 M30 0h9"/><path d="m0-7 7 7-7 7-7-7z"/></g>
</defs>
<rect width="1280" height="640" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="638" rx="18" fill="none" stroke="#5b4c34"/>
<path d="M44 42h34 M44 42v34 M1236 42h-34 M1236 42v34 M44 598h34 M44 598v-34 M1236 598h-34 M1236 598v-34" fill="none" stroke="#bba06c" stroke-width="2"/>
<circle cx="1080" cy="214" r="220" fill="url(#glow)"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="72" y="87" fill="#c6ae7b" font-size="15" letter-spacing="4">SQUANCHER'S</text>
<text x="68" y="168" fill="#f5f1e7" font-size="76" font-weight="bold" letter-spacing="-3">Squanch-On</text>
<text x="72" y="231" fill="#f5f1e7" font-size="30" font-weight="bold">Keep the camera locked.</text>
<text x="72" y="276" fill="#c7c8c3" font-size="27">Open mouseover only when you mean it.</text>
<text x="72" y="320" fill="#9ea8ad" font-size="17">Native mouselook. Deliberate mouseover. Your abilities.</text>
<g transform="translate(1080 208)" color="#c5a571"><use href="#aim" transform="scale(2.75)"/></g>
<path d="M1048 208h64" stroke="#df7862" stroke-width="3"/>
<circle cx="1080" cy="208" r="5" fill="#f3c5aa"/>
<rect x="64" y="374" width="360" height="172" rx="12" fill="#1a2023" stroke="#3b4347"/>
<rect x="460" y="374" width="360" height="172" rx="12" fill="#27201d" stroke="#bb795c"/>
<rect x="856" y="374" width="360" height="172" rx="12" fill="#1a2023" stroke="#3b4347"/>
<text x="88" y="411" fill="#c5a571" font-size="14" letter-spacing="2">01 / STEER</text>
<text x="484" y="411" fill="#e1ad8d" font-size="14" letter-spacing="2">02 / HOLD RIGHT MOUSE</text>
<text x="880" y="411" fill="#c5a571" font-size="14" letter-spacing="2">03 / RELEASE</text>
<g transform="translate(112 465)" color="#77878e"><use href="#aim"/></g>
<g transform="translate(508 465)" color="#e38a70"><use href="#aim"/><circle r="12" fill="#e38a70" opacity=".25"/></g>
<g transform="translate(904 465)" color="#77878e"><use href="#aim"/></g>
<text x="166" y="459" fill="#f1eee7" font-size="21" font-weight="bold">Mouseover closed</text>
<text x="562" y="459" fill="#f1eee7" font-size="21" font-weight="bold">Mouseover open</text>
<text x="958" y="459" fill="#f1eee7" font-size="21" font-weight="bold">Mouseover closed</text>
<text x="166" y="490" fill="#aebbc1" font-size="16">Camera stays locked</text>
<text x="562" y="490" fill="#e0bba8" font-size="16">Camera stays locked</text>
<text x="958" y="490" fill="#aebbc1" font-size="16">Camera stays locked</text>
<path d="m435 451 10 10-10 10 M437 461h-9 m403-10 10 10-10 10 M833 461h-9" stroke="#bba06c" stroke-width="2" fill="none"/>
<text x="72" y="585" fill="#9ca8ae" font-size="14">CONTROL DIAGRAM</text>
<text x="1208" y="585" text-anchor="end" fill="#9ca8ae" font-size="14">Hold the free-cursor key to use the UI; release to return.</text>
</g>
</svg>
